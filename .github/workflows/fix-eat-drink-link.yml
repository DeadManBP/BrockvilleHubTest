name: Fix Eat and Drink link

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-link:
    if: ${{ !contains(github.event.head_commit.message, 'Fix Eat and Drink link') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Fix Things To Do link
        run: sed -i 's/🍔 Food & Drink/🍴 Eat \& Drink/g' BrockvilleTestHub/app/src/main/assets/index.html
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BrockvilleTestHub/app/src/main/assets/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix Eat and Drink link"
          git push
