name: Force Power & Utilities navigation fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[power nav v2]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace broken Power & Utilities handler
        working-directory: BrockvilleTestHub
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/assets/index.html')
          s = p.read_text(encoding='utf-8')
          old = 'onclick="show(\'power\')"'
          new = 'onclick="document.getElementById(\'m\').innerHTML=P.power; window.scrollTo(0,0)"'
          if old not in s:
              raise SystemExit('Expected Power & Utilities handler was not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BrockvilleTestHub/app/src/main/assets/index.html
          git commit -m "Force Power & Utilities navigation [power nav v2]"
          git push
