name: Separate City Notices

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[city notices]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Split City Notices from Local News
        working-directory: BrockvilleTestHub
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/assets/index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('<button class="tile" data-p="news">📢<b>City Notices</b><span>News & announcements</span></button>', '<button class="tile" data-p="notices">📢<b>City Notices</b><span>Official City announcements</span></button>', 1)
          s = s.replace('<div class="head"><h2>Latest from City Hall</h2><a data-p="news">See all</a>', '<div class="head"><h2>Latest from City Hall</h2><a data-p="notices">See all</a>', 1)
          s = s.replace('<button class="tile primary" data-p="news" style="width:100%">📢 View City Notices</button>', '<button class="tile primary" data-p="notices" style="width:100%">📢 View City Notices</button>', 1)

          old_local = '<div class="head"><h2>Local News</h2><a data-p="news">See all</a>'
          s = s.replace(old_local, '<div class="head"><h2>Local News</h2><a data-p="news">See all</a>', 1)

          old_news = 'news:`<div class="pagehead"><button class="back" data-p="home">←</button><h2>Local News</h2></div><section class="sec"><div class="head"><h3>Newspapers & Digital</h3></div><div class="grid">${cards([\'📰 Recorder & Times\',\'📰 Brockvilleist\',\'📰 Brockville Daily\'])}</div></section><section class="sec"><div class="head"><h3>Local TV</h3></div><div class="grid">${cards([\'📺 Hometown TV12\',\'📺 YourTV Brockville\'])}</div></section><section class="sec"><div class="head"><h3>Local Radio</h3></div><div class="grid">${cards([\'📻 104.9 myFM\',\'📻 103.7 GIANT FM\'])}</div></section><section class="sec"><div class="card"><div class="cardbody"><span class="badge">OFFICIAL</span><h3>City of Brockville Notices</h3><p class="muted">Municipal announcements are kept separate from independent local reporting.</p><button class="tile primary" style="width:100%" onclick="openLink(\'https://brockville.com/news/\')">🏛️ City News</button></div></div></section>`,'
          new_news = 'news:`<div class="pagehead"><button class="back" data-p="home">←</button><h2>Local News</h2></div><section class="sec"><div class="card"><div class="cardbody"><span class="badge">LOCAL MEDIA</span><h3>Brockville news sources</h3><p class="muted">Independent local reporting, newspapers, television and radio. These are separate from official City notices.</p></div></div></section><section class="sec"><div class="head"><h3>Newspapers & Digital</h3></div><div class="grid">${cards([\'📰 Recorder & Times\',\'📰 Brockvilleist\',\'📰 Brockville Daily\'])}</div></section><section class="sec"><div class="head"><h3>Local TV</h3></div><div class="grid">${cards([\'📺 Hometown TV12\',\'📺 YourTV Brockville\'])}</div></section><section class="sec"><div class="head"><h3>Local Radio</h3></div><div class="grid">${cards([\'📻 104.9 myFM\',\'📻 103.7 GIANT FM\'])}</div></section>`,'
          if old_news not in s:
              raise SystemExit('Local News page pattern not found')
          s = s.replace(old_news, new_news, 1)

          notices = 'notices:`<div class="pagehead"><button class="back" data-p="home">←</button><h2>City Notices</h2></div><div class="card"><div class="cardbody"><span class="badge">OFFICIAL CITY OF BROCKVILLE</span><h3>Municipal announcements</h3><p class="muted">Official notices from the City of Brockville, separate from local media reporting. The City says its announcements are the primary means of public communication and emergency updates.</p><button class="tile primary" style="width:100%" onclick="openLink(\'https://brockville.com/announcements/\')">📢 View All Official City Announcements</button></div></div><section class="sec"><h3>Recent official notices</h3><div class="card"><div class="event"><div class="date"><b>29</b><small>JUL</small></div><div><span class="badge">CITY NOTICE</span><b>2026 Civic Holiday Schedule</b><div class="muted">City facilities, waste collection, transit and service changes.</div><button class="tile" style="margin-top:8px;width:100%" onclick="openLink(\'https://brockville.com/announcement/2026-civic-holiday-schedule/\')">Read City Notice</button></div></div><div class="event"><div class="date"><b>29</b><small>JUL</small></div><div><span class="badge">CITY NOTICE</span><b>Citywide Portal Launch</b><div class="muted">New online portal for reporting non-emergency City service issues.</div><button class="tile" style="margin-top:8px;width:100%" onclick="openLink(\'https://brockville.com/announcement/city-launches-new-online-portal-to-improve-service-delivery/\')">Read City Notice</button></div></div><div class="event"><div class="date"><b>14</b><small>JUL</small></div><div><span class="badge">PUBLIC NOTICE</span><b>Stay Cool in Brockville During a Heat Wave</b><div class="muted">City cooling locations and heat safety information.</div><button class="tile" style="margin-top:8px;width:100%" onclick="openLink(\'https://brockville.com/announcement/stay-cool-in-brockville-during-a-heat-wave-2/\')">Read City Notice</button></div></div><div class="event"><div class="date"><b>09</b><small>JUL</small></div><div><span class="badge">CONSTRUCTION</span><b>Parkdale Avenue & Windsor Drive Intersection</b><div class="muted">Construction notice and traffic impacts.</div><button class="tile" style="margin-top:8px;width:100%" onclick="openLink(\'https://brockville.com/news/construction-notice-parkdale-avenue-and-windsor-drive-intersection/\')">Read City Notice</button></div></div></div></section><section class="sec"><div class="grid"><button class="tile" onclick="openLink(\'https://brockville.com/city-services/emergency-services/\')">🚨<b>Emergency Information</b><span>Official City emergency updates</span></button><button class="tile" onclick="openLink(\'https://brockville.com/announcements/\')">🔔<b>City Announcements</b><span>Official announcement feed</span></button></div></section>`,'
          marker = 'news:`'
          if 'notices:`' not in s:
              if marker not in s:
                  raise SystemExit('News page marker not found')
              s = s.replace(marker, notices + '\nnews:`', 1)

          s = s.replace("${cards(['🍴 Eat & Drink','📰 Local News'", "${cards(['🍴 Eat & Drink','📢 City Notices','📰 Local News'", 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit source change
        run: |
          git config user.name "BrockvilleHub Bot"
          git config user.email "actions@github.com"
          git add BrockvilleTestHub/app/src/main/assets/index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Separate City Notices from local news [city notices]"
          git push