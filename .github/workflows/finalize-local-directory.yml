name: Finalize BrockvilleHub APK

on:
  workflow_run:
    workflows: ["Build BrockvilleHub APK"]
    types: [completed]

jobs:
  finalize:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work
          gh run download "${{ github.event.workflow_run.id }}" -R "${{ github.repository }}" -n BrockvilleHub-debug-apk -D work
          mv work/app-debug.apk BrockvilleHub-patched.apk

      - name: Patch APK without rebuilding its ZIP structure
        run: |
          mkdir -p patch/assets clean/assets
          unzip -p BrockvilleHub-patched.apk assets/index.html > patch/assets/index.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path('patch/assets/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace("https://weather.gc.ca/city/pages/on-15_metric_e.html", "https://weather.gc.ca/en/location/index.html?coords=44.597%2C-75.686")
          p.write_text(s, encoding='utf-8')
          PY
          cp patch/assets/index.html clean/assets/index.html
          zip -d BrockvilleHub-patched.apk 'assets/index.html' 'META-INF/*' >/dev/null
          (cd clean && zip -q0 ../BrockvilleHub-patched.apk assets/index.html)

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Align and sign APK
        run: |
          sdkmanager "build-tools;35.0.0" "platform-tools"
          $ANDROID_HOME/build-tools/35.0.0/zipalign -f 4 BrockvilleHub-patched.apk BrockvilleHub-aligned.apk
          keytool -genkeypair -v -keystore debug-final.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign --ks debug-final.keystore --ks-pass pass:android --key-pass pass:android --out BrockvilleHub-final.apk BrockvilleHub-aligned.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose BrockvilleHub-final.apk

      - name: Upload finalized APK
        uses: actions/upload-artifact@v4
        with:
          name: BrockvilleHub-final-apk
          path: BrockvilleHub-final.apk
          if-no-files-found: error
          retention-days: 7
