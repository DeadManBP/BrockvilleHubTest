name: Remove duplicate Power & Utilities tiles

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate Power tiles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('BrockvilleTestHub/app/src/main/assets/index.html')
          s = p.read_text(encoding='utf-8')
          dup = '<button class="tile" data-power-open>⚡<b>Power & Utilities</b><span>Outages & Hydro One</span></button>'
          n = s.count(dup)
          if n:
              s = s.replace(dup, '', n)
              p.write_text(s, encoding='utf-8')
              print(f'Removed {n} duplicate Power & Utilities tiles; retained the working data-p="power" tile.')
          else:
              print('No duplicate data-power-open tiles found; nothing to change.')
          if s.count('data-p="power"') < 1:
              raise SystemExit('Working Power tile is missing; refusing to modify source.')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BrockvilleTestHub/app/src/main/assets/index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Remove duplicate Power & Utilities tiles'
            git push
          fi
