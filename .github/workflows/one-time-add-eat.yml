name: One-time Eat and Drink update
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app
        shell: python
        run: |
          from pathlib import Path
          p = Path('BrockvilleTestHub/app/src/main/assets/index.html')
          s = p.read_text()
          s = s.replace("'📻 103.7 GIANT FM':'https://www.brockvilledaily.ca/'", "'📻 103.7 GIANT FM':'https://www.brockvilledaily.ca/','🍴 Eat & Drink':'#eat'")
          marker = "more:`<div class=\"pagehead\"><button class=\"back\" data-p=\"home\">←</button><h2>More Brockville</h2></div><div class=\"grid\">"
          replacement = "eat:`<div class=\"pagehead\"><button class=\"back\" data-p=\"more\">←</button><h2>Eat & Drink</h2></div><div class=\"card\"><div class=\"cardbody\"><span class=\"badge\">BROCKVILLE</span><h3>Local food & drink</h3><p class=\"muted\">Browse local restaurants, cafés, pubs and fish & chips. Every listing has a Google Maps search, and selected businesses also have a direct website.</p><button class=\"tile primary\" style=\"width:100%\" onclick=\"openLink('https://brockvilletourism.com/eat-and-drink/restaurants/')\">🍴 Brockville Tourism restaurant directory</button></div></div><section class=\"sec\"><h3>Popular local spots</h3><div class=\"grid\"><button class=\"tile\" onclick=\"openLink('https://www.google.com/maps/search/?api=1&query=Don%27s+Fish+%26+Chips%2C+Brockville%2C+ON')\">🍟<b>Don's Fish & Chips</b><span>40 Water St W · Maps</span></button><button class=\"tile\" onclick=\"openLink('https://donsfishandchips.com/')\">🌐<b>Don's website</b><span>Menu & information</span></button><button class=\"tile\" onclick=\"openLink('https://www.google.com/maps/search/?api=1&query=1000+Islands+Restaurant+%26+Pizzeria%2C+Brockville%2C+ON')\">🍕<b>1000 Islands Restaurant & Pizzeria</b><span>226 King St W · Maps</span></button><button class=\"tile\" onclick=\"openLink('https://1000islandspizza.com/')\">🌐<b>1000 Islands Pizza</b><span>Official website</span></button><button class=\"tile\" onclick=\"openLink('https://www.google.com/maps/search/?api=1&query=Barley+Mow%2C+Brockville%2C+ON')\">🍺<b>Barley Mow</b><span>Pub & grill · Maps</span></button><button class=\"tile\" onclick=\"openLink('https://www.google.com/maps/search/?api=1&query=Buell+Street+Bistro%2C+Brockville%2C+ON')\">🍽️<b>Buell Street Bistro</b><span>Fine dining · Maps</span></button><button class=\"tile\" onclick=\"openLink('https://www.google.com/maps/search/?api=1&query=Nakhon+Thai%2C+Brockville%2C+ON')\">🍜<b>Nakhon Thai</b><span>Thai cuisine · Maps</span></button><button class=\"tile\" onclick=\"openLink('https://nakhonthai.ca/')\">🌐<b>Nakhon Thai</b><span>Official website</span></button><button class=\"tile\" onclick=\"openLink('https://www.google.com/maps/search/?api=1&query=The+Mill+Restaurant%2C+Brockville%2C+ON')\">🍝<b>The Mill Restaurant</b><span>123 Water St W · Maps</span></button><button class=\"tile\" onclick=\"openLink('https://themillrestaurant.ca/')\">🌐<b>The Mill Restaurant</b><span>Official website</span></button><button class=\"tile\" onclick=\"openLink('https://www.google.com/maps/search/?api=1&query=Keystorm+Pub%2C+Brockville%2C+ON')\">🍻<b>Keystorm Pub</b><span>2 Court House Ave · Maps</span></button><button class=\"tile\" onclick=\"openLink('https://keystormpub.ca/')\">🌐<b>Keystorm Pub</b><span>Official website</span></button><button class=\"tile\" onclick=\"openLink('https://www.google.com/maps/search/?api=1&query=Richard%27s+Coffeehouse%2C+Brockville%2C+ON')\">☕<b>Richard's Coffeehouse</b><span>Café · Maps</span></button><button class=\"tile\" onclick=\"openLink('https://www.google.com/maps/search/?api=1&query=Manoll%27s+Fish+%26+Chips%2C+Brockville%2C+ON')\">🍟<b>Manoll's Fish & Chips</b><span>11 Buell St · Maps</span></button><button class=\"tile\" onclick=\"openLink('https://www.google.com/maps/search/?api=1&query=Sam%27s+Grill%2C+Brockville%2C+ON')\">🍔<b>Sam's Grill</b><span>Burgers & poutine · Maps</span></button><button class=\"tile\" onclick=\"openLink('https://www.google.com/maps/search/?api=1&query=One+Love+Jamaican+Cuisine%2C+Brockville%2C+ON')\">🌴<b>One Love Jamaican Cuisine</b><span>Jamaican · Maps</span></button></div></section><section class=\"sec\"><div class=\"card\"><div class=\"cardbody\"><span class=\"badge\">MORE</span><h3>Find every local option</h3><p class=\"muted\">Brockville Tourism maintains the broader local dining directory, including cafés, pubs, international food and seasonal spots.</p><button class=\"tile\" style=\"width:100%\" onclick=\"openLink('https://brockvilletourism.com/eat-and-drink/restaurants/')\">📋 Full restaurant directory</button></div></div></section>`,\nmore:`<div class=\"pagehead\"><button class=\"back\" data-p=\"home\">←</button><h2>More Brockville</h2></div><div class=\"grid\">"
          if marker not in s:
              raise SystemExit('More page marker not found; refusing to modify file')
          s = s.replace(marker, replacement, 1)
          s = s.replace("${cards(['📰 Local News','📜 Bylaws'", "${cards(['🍴 Eat & Drink','📰 Local News','📜 Bylaws'", 1)
          s = s.replace("function show(p,fromHistory=false){", "function show(p,fromHistory=false){")
          p.write_text(s)
      - name: Commit app update and remove this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BrockvilleTestHub/app/src/main/assets/index.html
          git rm .github/workflows/one-time-add-eat.yml
          git commit -m 'Add Eat and Drink local business section'
          git push
