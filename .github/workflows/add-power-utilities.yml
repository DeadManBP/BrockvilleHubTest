name: Add Power & Utilities

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[power utilities]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Hydro One Power & Utilities section
        working-directory: BrockvilleTestHub
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/src/main/assets/index.html')
          s = p.read_text(encoding='utf-8')

          power_tile = '<button class="tile" data-p="power">⚡<b>Power & Utilities</b><span>Outages & Hydro One</span></button>'
          if 'data-p="power"' not in s:
              m = re.search(r'<button[^>]+data-p="explore"[^>]*>.*?</button>', s, re.S)
              if not m:
                  raise SystemExit('Could not find Things To Do tile')
              s = s[:m.end()] + power_tile + s[m.end():]

          if 'power:`' not in s:
              power_page = '''<div class="pagehead"><button class="back" data-p="home">←</button><h2>Power & Utilities</h2></div>
          <div class="card"><div class="cardbody"><span class="badge">HYDRO ONE</span><h3>⚡ Power Outages</h3><p class="muted">Check current outages, affected areas, crew status and estimated restoration times for Hydro One customers.</p><button class="tile primary" style="width:100%" onclick="openLink('https://www.hydroone.com/power-outages-and-safety/storm-centre')">⚡ Open Hydro One Storm Centre</button></div></div>
          <section class="sec"><h3>🔌 Outage Tools</h3><div class="grid">
          <button class="tile" onclick="openLink('https://www.hydroone.com/power-outages-and-safety/storm-centre')">🗺️<b>Outage Map</b><span>View current outages · Hydro One</span></button>
          <button class="tile" onclick="openLink('https://www.hydroone.com/support/contact')">🚨<b>Report an Outage</b><span>Online or call 1-800-434-1235</span></button>
          <button class="tile" onclick="openLink('https://www.hydroone.com/request-a-service/outage-alerts')">🔔<b>Outage Alerts</b><span>Sign up for outage notifications</span></button>
          <button class="tile" onclick="openLink('https://www.hydroone.com/power-outages-and-safety')">🛡️<b>Power Outage Safety</b><span>Storm preparation & safety information</span></button>
          </div></section>
          <section class="sec"><div class="card"><div class="cardbody"><span class="badge">LIVE DATA</span><h3>Storm Centre updates</h3><p class="muted">Hydro One says its outage map is updated every 10 minutes as information comes in from crews. The map can be searched by city, address or postal code.</p><button class="tile" style="width:100%" onclick="openLink('https://www.hydroone.com/power-outages-and-safety/storm-centre')">🌐 View live outage information</button></div></div></section>'''
              marker = 'more:`'
              if marker not in s:
                  raise SystemExit('Could not find More page marker')
              replacement = 'power:`' + power_page.replace('`','\\`') + '`,\nmore:`'
              s = s.replace(marker, replacement, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BrockvilleTestHub/app/src/main/assets/index.html
          if git diff --cached --quiet; then
            echo "Power & Utilities already present"
            exit 0
          fi
          git commit -m "Fix Power & Utilities placement [power utilities]"
          git push
