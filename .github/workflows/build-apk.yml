name: Build BrockvilleHub APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix Eat and Drink navigation and add Chinese restaurants
        working-directory: BrockvilleTestHub
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/assets/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace("'🍴 Eat & Drink':'#eat'", "'🍴 Eat & Drink':'__HUB_EAT__'")
          old = "const cards=(a)=>a.map(x=>LINKS[x]?`<button class=\"tile\" onclick=\"openLink('${LINKS[x]}')\">${x}</button>`:`<button class=\"tile\">${x}</button>`).join('');"
          new = "const cards=(a)=>a.map(x=>x==='🍴 Eat & Drink'?`<button class=\"tile\" data-p=\"eat\">${x}</button>`:LINKS[x]?`<button class=\"tile\" onclick=\"openLink('${LINKS[x]}')\">${x}</button>`:`<button class=\"tile\">${x}</button>`).join('');"
          if old in s:
              s = s.replace(old, new)
          else:
              raise SystemExit('Could not find cards() function; refusing to build a possibly broken app.')
          old_home = '<button class="tile" data-p="explore">❤️<b>Things To Do</b><span>Explore Brockville</span></button>'
          new_home = old_home + '<button class="tile" data-p="eat">🍴<b>Eat & Drink</b><span>Restaurants, cafés & pubs</span></button>'
          if old_home in s and 'data-p="eat">🍴<b>Eat & Drink' not in s:
              s = s.replace(old_home, new_home, 1)

          anchor = '<section class="sec"><h3>Popular local spots</h3>'
          chinese = '''<section class="sec"><h3>🥡 Chinese & Chinese-Thai</h3><div class="grid"><button class="tile" onclick="openLink('https://www.google.com/maps/search/?api=1&query=Lee%27s+Kitchen+Restaurant%2C+2523+Parkedale+Ave%2C+Brockville%2C+ON')">🥡<b>Lee's Kitchen</b><span>2523 Parkedale Ave · Maps</span></button><button class="tile" onclick="openLink('https://www.google.com/maps/search/?api=1&query=Golden+Gate+Restaurant%2C+172+King+St+W%2C+Brockville%2C+ON')">🥡<b>Golden Gate Restaurant</b><span>172 King St W · Maps</span></button><button class="tile" onclick="openLink('https://www.google.com/maps/search/?api=1&query=Island+Delight+Restaurant%2C+140+King+St+W%2C+Brockville%2C+ON')">🥡<b>Island Delight</b><span>140 King St W · Maps</span></button><button class="tile" onclick="openLink('https://www.goldengaterestaurant.ca/')">🌐<b>Golden Gate website</b><span>Menu, hours & delivery</span></button></div></section>'''
          if anchor in s and '🥡 Chinese & Chinese-Thai' not in s:
              s = s.replace(anchor, chinese + anchor, 1)
          elif '🥡 Chinese & Chinese-Thai' not in s:
              raise SystemExit('Could not find Eat & Drink insertion point; refusing to build a possibly broken app.')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: BrockvilleTestHub
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BrockvilleHub-debug-apk
          path: BrockvilleTestHub/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
