name: Build BrockvilleHub APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add food and drink categories
        working-directory: BrockvilleTestHub
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/assets/index.html')
          s = p.read_text(encoding='utf-8')

          sections = '''<section class="sec"><h3>🍕 Pizza & Italian</h3><div class="grid">
          <button class="tile" onclick="openLink('https://www.google.com/maps/search/?api=1&query=1000+Islands+Restaurant+%26+Pizzeria%2C+Brockville%2C+ON')">🍕<b>1000 Islands Restaurant & Pizzeria</b><span>226 King St W · Maps</span></button>
          <button class="tile" onclick="openLink('https://www.google.com/maps/search/?api=1&query=Luna+Pizzeria+%26+Restaurant%2C+Brockville%2C+ON')">🍕<b>Luna Pizzeria & Restaurant</b><span>Pizza & Italian · Maps</span></button>
          <button class="tile" onclick="openLink('https://www.google.com/maps/search/?api=1&query=241+Pizza%2C+Brockville%2C+ON')">🍕<b>241 Pizza</b><span>101 King St W · Maps</span></button>
          <button class="tile" onclick="openLink('https://www.google.com/maps/search/?api=1&query=Papa%27s+Pizzaland%2C+Brockville%2C+ON')">🍕<b>Papa's Pizzaland</b><span>191 King St W · Maps</span></button>
          <button class="tile" onclick="openLink('https://www.google.com/maps/search/?api=1&query=The+Mill+Restaurant%2C+Brockville%2C+ON')">🍝<b>The Mill - A Taste of Italy</b><span>123 Water St W · Maps</span></button>
          </div></section>

          <section class="sec"><h3>☕ Cafés & Breakfast</h3><div class="grid">
          <button class="tile" onclick="openLink('https://www.google.com/maps/search/?api=1&query=Boboli%2C+Brockville%2C+ON')">☕<b>Boboli</b><span>Café & deli · Maps</span></button>
          <button class="tile" onclick="openLink('https://www.google.com/maps/search/?api=1&query=Cosies%2C+Brockville%2C+ON')">☕<b>Cosies</b><span>Café & lunch · Maps</span></button>
          <button class="tile" onclick="openLink('https://www.google.com/maps/search/?api=1&query=Richard%27s+Coffeehouse%2C+Brockville%2C+ON')">☕<b>Richard's Coffeehouse</b><span>Coffee & café · Maps</span></button>
          <button class="tile" onclick="openLink('https://www.google.com/maps/search/?api=1&query=Jon%27s+Restaurant%2C+Brockville%2C+ON')">🍳<b>Jon's Restaurant</b><span>Diner & breakfast · Maps</span></button>
          <button class="tile" onclick="openLink('https://www.google.com/maps/search/?api=1&query=Tincap+Restaurant%2C+Brockville%2C+ON')">🍳<b>Tincap Restaurant</b><span>Diner & breakfast · Maps</span></button>
          <button class="tile" onclick="openLink('https://www.google.com/maps/search/?api=1&query=Sweet+Ofelia+Cafe+%26+Market%2C+Brockville%2C+ON')">☕<b>Sweet Ofelia Cafe & Market</b><span>Café & market · Maps</span></button>
          </div></section>

          <section class="sec"><h3>🍟 Fish & Chips / Casual</h3><div class="grid">
          <button class="tile" onclick="openLink('https://www.google.com/maps/search/?api=1&query=Don%27s+Fish+%26+Chips%2C+Brockville%2C+ON')">🍟<b>Don's Fish & Chips</b><span>40 Water St W · Maps</span></button>
          <button class="tile" onclick="openLink('https://www.google.com/maps/search/?api=1&query=Manoll%27s+Fish+%26+Chips%2C+Brockville%2C+ON')">🍟<b>Manoll's Fish & Chips</b><span>11 Buell St · Maps</span></button>
          <button class="tile" onclick="openLink('https://www.google.com/maps/search/?api=1&query=Captain+George%27s+Fish+%26+Chips%2C+Brockville%2C+ON')">🐟<b>Captain George's Fish & Chips</b><span>Fish & chips · Maps</span></button>
          <button class="tile" onclick="openLink('https://www.google.com/maps/search/?api=1&query=Sam%27s+Grill%2C+Brockville%2C+ON')">🍔<b>Sam's Grill</b><span>Burgers & poutine · Maps</span></button>
          </div></section>

          <section class="sec"><h3>🌮 International</h3><div class="grid">
          <button class="tile" onclick="openLink('https://www.google.com/maps/search/?api=1&query=Buell+Street+Bistro%2C+Brockville%2C+ON')">🍽️<b>Buell Street Bistro</b><span>Mediterranean & international · Maps</span></button>
          <button class="tile" onclick="openLink('https://www.google.com/maps/search/?api=1&query=Nakhon+Thai%2C+Brockville%2C+ON')">🍜<b>Nakhon Thai</b><span>Thai cuisine · Maps</span></button>
          <button class="tile" onclick="openLink('https://www.google.com/maps/search/?api=1&query=Indian+Cuisine+Hub%2C+Brockville%2C+ON')">🍛<b>Indian Cuisine Hub</b><span>Indian cuisine · Maps</span></button>
          <button class="tile" onclick="openLink('https://www.google.com/maps/search/?api=1&query=Shawarma+Garden%2C+Brockville%2C+ON')">🥙<b>Shawarma Garden</b><span>Middle Eastern · Maps</span></button>
          <button class="tile" onclick="openLink('https://www.google.com/maps/search/?api=1&query=Mexicali+Rosa%27s%2C+Brockville%2C+ON')">🌮<b>Mexicali Rosa's</b><span>Mexican · Maps</span></button>
          <button class="tile" onclick="openLink('https://www.google.com/maps/search/?api=1&query=Pho+Hut%2C+Brockville%2C+ON')">🍜<b>Pho Hut</b><span>Vietnamese · Maps</span></button>
          </div></section>

          <section class="sec"><h3>🍺 Pubs & Bars</h3><div class="grid">
          <button class="tile" onclick="openLink('https://www.google.com/maps/search/?api=1&query=Barley+Mow%2C+Brockville%2C+ON')">🍺<b>Barley Mow</b><span>Pub & grill · Maps</span></button>
          <button class="tile" onclick="openLink('https://www.google.com/maps/search/?api=1&query=Keystorm+Pub%2C+Brockville%2C+ON')">🍻<b>Keystorm Pub</b><span>2 Court House Ave · Maps</span></button>
          <button class="tile" onclick="openLink('https://www.google.com/maps/search/?api=1&query=1000+Islands+Brewing%2C+Brockville%2C+ON')">🍺<b>1000 Islands Brewing</b><span>Brewery & pub · Maps</span></button>
          <button class="tile" onclick="openLink('https://www.google.com/maps/search/?api=1&query=Finnigan%27s+Tavern%2C+Brockville%2C+ON')">🍻<b>Finnigan's Tavern</b><span>72 King St W · Maps</span></button>
          <button class="tile" onclick="openLink('https://www.google.com/maps/search/?api=1&query=Moose+McGuire%27s%2C+Brockville%2C+ON')">🍺<b>Moose McGuire's</b><span>Pub · Maps</span></button>
          </div></section>'''

          marker = '<section class="sec"><h3>Popular local spots</h3>'
          if '🍕 Pizza & Italian' not in s:
              if marker not in s:
                  raise SystemExit('Could not find Eat & Drink insertion point; refusing to build a possibly broken app.')
              s = s.replace(marker, sections + '\n' + marker, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: BrockvilleTestHub
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BrockvilleHub-debug-apk
          path: BrockvilleTestHub/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
