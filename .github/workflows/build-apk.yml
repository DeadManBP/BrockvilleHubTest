name: Build BrockvilleHub APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Organize Eat and Drink
        working-directory: BrockvilleTestHub
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/src/main/assets/index.html')
          s = p.read_text(encoding='utf-8')

          # Make Eat & Drink a real in-app destination instead of the old #eat URL.
          s = s.replace("'🍴 Eat & Drink':'#eat'", "'🍴 Eat & Drink':'__HUB_EAT__'")
          old_cards = "const cards=(a)=>a.map(x=>LINKS[x]?`<button class=\"tile\" onclick=\"openLink('${LINKS[x]}')\">${x}</button>`:`<button class=\"tile\">${x}</button>`).join('');"
          new_cards = "const cards=(a)=>a.map(x=>x==='🍴 Eat & Drink'?`<button class=\"tile\" data-p=\"eat\">${x}</button>`:LINKS[x]?`<button class=\"tile\" onclick=\"openLink('${LINKS[x]}')\">${x}</button>`:`<button class=\"tile\">${x}</button>`).join('');"
          if old_cards in s:
              s = s.replace(old_cards, new_cards, 1)

          # Restore the main-page Eat & Drink tile if it was lost in a previous build step.
          home_tile = '<button class="tile" data-p="explore">❤️<b>Things To Do</b><span>Explore Brockville</span></button>'
          eat_tile = '<button class="tile" data-p="eat">🍴<b>Eat & Drink</b><span>Restaurants, cafés & pubs</span></button>'
          if eat_tile not in s:
              if home_tile not in s:
                  raise SystemExit('Could not find Things To Do home tile; refusing to build a possibly broken app.')
              s = s.replace(home_tile, home_tile + eat_tile, 1)

          # Remove the old catch-all Popular local spots block. Restaurants should live in their
          # proper category, with only genuinely uncategorized businesses kept elsewhere.
          s = re.sub(r'<section class="sec"><h3>Popular local spots</h3>.*?</section>', '', s, count=1, flags=re.S)

          # One Love is international food, so keep it with International rather than a duplicate list.
          international_anchor = '<button class="tile" onclick="openLink(\'https://www.google.com/maps/search/?api=1&query=Pho+Hut%2C+Brockville%2C+ON\')">🍜<b>Pho Hut</b><span>Vietnamese · Maps</span></button>'
          one_love = '<button class="tile" onclick="openLink(\'https://www.google.com/maps/search/?api=1&query=One+Love+Jamaican+Cuisine%2C+Brockville%2C+ON\')">🌴<b>One Love Jamaican Cuisine</b><span>Jamaican · Maps</span></button>'
          if one_love not in s and international_anchor in s:
              s = s.replace(international_anchor, international_anchor + one_love, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: BrockvilleTestHub
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BrockvilleHub-debug-apk
          path: BrockvilleTestHub/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
