name: Remove Power Utilities section

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-power:
    if: ${{ !contains(github.event.head_commit.message, '[remove power]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove every Power Utilities remnant
        working-directory: BrockvilleTestHub
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<button\b[^>]*>\s*⚡\s*<b>Power\s*&\s*Utilities</b>.*?</button>', '', s, flags=re.S)
          s=re.sub(r'\n?power:`.*?`,\nmore:', '\nmore:', s, flags=re.S)
          s=re.sub(r'\nfunction\s+__brockvilleHubPowerRouter\b.*?(?=\nfunction\s+openPowerUtilities\b|\ndocument\.addEventListener)', '', s, flags=re.S)
          s=re.sub(r'\nfunction\s+openPowerUtilities\s*\(\).*?document\.addEventListener\s*\(\s*["\']click["\'].*?\);', '', s, flags=re.S)
          s=re.sub(r'\ndocument\.addEventListener\s*\(\s*["\']click["\']\s*,\s*function\s*\(e\)\s*\{\s*const\s+b\s*=\s*e\.target\.closest\s*\(\s*["\']\[data-power-open\]["\']\s*\).*?\}\s*\}\s*\);', '', s, flags=re.S)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify Power Utilities is completely removed
        working-directory: BrockvilleTestHub
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          checks=['Power & Utilities','data-p="power"','data-power-open','openPowerUtilities','__brockvilleHubPowerRouter','Outages & Hydro One','Hydro One Storm Centre']
          found=[x for x in checks if x in s]
          if found:
              raise SystemExit('Power remnants still present: '+', '.join(found))
          print('Power Utilities section completely removed')
          PY
git config user.name 'github-actions[bot]'
git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
git add BrockvilleTestHub/app/src/main/assets/index.html
git diff --cached --quiet && exit 0
git commit -m '[remove power] Remove Power Utilities section entirely'
git push
