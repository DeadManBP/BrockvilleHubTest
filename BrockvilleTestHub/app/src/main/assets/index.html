<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brockville Hub</title><style>
*{box-sizing:border-box}body{margin:0;background:#071b2a;color:#f7fbfc;font:15px system-ui;line-height:1.4}.app{max-width:720px;margin:auto;padding-bottom:75px}
.hero{padding:22px 17px 20px;background:radial-gradient(circle at 90% 5%,#2d8296,transparent 35%),linear-gradient(145deg,#0d4054,#071b2a)}
.logo{display:inline-grid;place-items:center;width:45px;height:45px;border-radius:15px;background:#43b7c7;font-size:24px;font-weight:900;margin-right:10px;vertical-align:middle}.brand{font-weight:800;font-size:20px}.sub{color:#9bc4cd;font-size:11px;letter-spacing:.12em}.hero h1{font-size:30px;line-height:1.05;margin:28px 0 5px}.muted{color:#a9c1ca;font-size:13px}.search{width:100%;padding:13px;border-radius:15px;border:1px solid #315263;background:#071b2a;color:white;margin-top:15px}
main{padding:0 15px}.sec{margin-top:18px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile,.card{background:linear-gradient(145deg,#12384d,#0d293a);border:1px solid #234556;border-radius:18px}.tile{padding:15px;text-align:left;color:white;cursor:pointer}.tile b{display:block;margin-top:7px}.tile span{display:block;color:#a9c1ca;font-size:12px;margin-top:3px}.primary{background:linear-gradient(135deg,#43b7c7,#287b91);border:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:12px;background:#0d293a;border:1px solid #234556;border-radius:15px}.stat b{display:block;font-size:21px}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#123f4c;color:#79d9e2;font-size:10px;font-weight:800}.cardbody{padding:15px}.event{display:flex;gap:12px;padding:12px 15px;border-bottom:1px solid #234556}.date{width:48px;min-width:48px;text-align:center;background:#0a2231;border-radius:12px;padding:5px}.date b{font-size:18px;display:block}.photo{height:105px;background:linear-gradient(135deg,#18506a,#0a2534);display:grid;place-items:center;font-size:42px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#06141f;border-top:1px solid #234556;padding:8px}.bottom button{border:0;background:none;color:#78929c;font-size:10px}.bottom .active{color:#7ce0e9}.bottom i{display:block;font-size:20px;font-style:normal}.back{padding:9px 12px;border-radius:12px;background:#102f42;color:white;border:1px solid #234556}.pagehead{display:flex;gap:10px;align-items:center;margin:18px 0}.map{height:230px;border-radius:20px;background:#12384d;position:relative;overflow:hidden;border:1px solid #234556}.river{position:absolute;right:-15%;top:-20%;width:65%;height:150%;background:#2d829633;border-radius:50%;transform:rotate(-18deg)}.pin{position:absolute;font-size:25px}.p1{left:25%;top:35%}.p2{left:55%;top:63%}.p3{left:70%;top:28%}
</style></head><body><div class="app"><header class="hero"><div><span class="logo">B</span><span class="brand">Brockville Hub</span><div class="sub">BROCKVILLE • ONTARIO • 1000 ISLANDS</div></div><h1>Your city.<br>One place.</h1><div class="muted">News, services, events and things to do.</div><input id="q" class="search" placeholder="🔎 Search Brockville Hub"></header><main id="m"></main>
<nav class="bottom"><button data-p="home">⌂<br>Home</button><button data-p="events">◷<br>Events</button><button data-p="report">⚠<br>Report</button><button data-p="map">⌖<br>Map</button><button data-p="more">☰<br>More</button></nav></div>
<script>
const m=document.getElementById('m');
const LINKS={'🗑️ Garbage & Recycling':'https://brockville.com/city-services/solidwaste/','🏛️ Council & Meetings':'https://brockville.civicweb.net/','📜 Bylaws':'https://brockville.com/local-government/bylaws/','🚌 Transit':'https://brockville.com/city-services/transit/','💧 Water & Sewer':'https://brockville.com/city-services/water-sewer-services/','🚨 Emergency Information':'https://brockville.com/city-services/emergency-services/','👮 Brockville Police':'https://brockvillepolice.com/','🌊 River Webcams':'https://brockville.com/river-webcams/','🌳 Parks & Trails':'https://brockville.com/things-to-do/parks-trails/','❤️ Things To Do':'https://brockville.com/things-to-do/','🏖️ Tourism':'https://brockvilletourism.com/','📢 City News':'https://brockville.com/news/','🏛️ City of Brockville':'https://brockville.com/','🚧 Citywide Portal':'https://citywideportal.com/','📰 Recorder & Times':'https://www.recorder.ca/','📰 Brockvilleist':'https://brockvilleist.com/','📰 Brockville Daily':'https://www.brockvilledaily.ca/','📺 Hometown TV12':'https://hometowntv12.ca/','📺 YourTV Brockville':'https://yourtv.tv/brockville','📻 104.9 myFM':'https://www.brockvilledaily.ca/','📻 103.7 GIANT FM':'https://www.brockvilledaily.ca/','🍴 Eat & Drink':'#eat','📅 Brockville Tourism Events':'https://brockvilletourism.com/shows-and-events/','🏢 Chamber Events':'https://members.brockvillechamber.com/eventcalendar','🎭 Brockville Arts Centre':'https://brockvilleartscentre.com/events/'};
function openLink(url){window.location.href=url;}
const cards=(a)=>a.map(x=>LINKS[x]?`<button class="tile" onclick="openLink('${LINKS[x]}')">${x}</button>`:`<button class="tile">${x}</button>`).join('');
const P={
home:`<section class="sec"><div class="grid"><button class="tile primary" data-p="report">🚧<b>Report an Issue</b><span>Citywide Portal</span></button><button class="tile" data-p="events">📅<b>What's Happening</b><span>Events & activities</span></button><button class="tile" data-p="notices">📢<b>City Notices</b><span>Official City announcements</span></button><button class="tile" data-p="explore">❤️<b>Things To Do</b><span>Explore Brockville</span></button></div></section><section class="sec"><div class="head"><h2>City at a glance</h2><span class="badge">PROTOTYPE</span></div><div class="stats"><div class="stat">🚧<b>6+</b><small>projects</small></div><div class="stat">📢<b>5</b><small>notices</small></div><div class="stat">🗳️<b>2026</b><small>election</small></div></div></section><section class="sec"><div class="head"><h2>Latest from City Hall</h2><a data-p="notices">See all</a></div><div class="card"><div class="cardbody"><span class="badge">CITY NEWS</span><h3>City announcements</h3><p class="muted">Official Brockville notices, projects and service updates.</p><button class="tile primary" data-p="notices" style="width:100%">📢 View City Notices</button></div></div></section><section class="sec"><div class="head"><h2>Local News</h2><a data-p="news">See all</a></div><div class="grid"><button class="tile" data-p="news">📰<b>Local news sources</b><span>Recorder & Times, Brockvilleist and more</span></button><button class="tile" data-p="news">📺<b>Local TV</b><span>Hometown TV12 & YourTV</span></button></div></section><section class="sec"><div class="head"><h2>Coming up</h2><a data-p="events">Calendar</a></div><div class="card"><div class="event"><div class="date"><b>22</b><small>AUG</small></div><div><span class="badge">MARKET</span><b>Brockville Farmers Market</b><div class="muted">8 AM–1 PM · Market Street West</div></div></div><div class="event"><div class="date"><b>28</b><small>AUG</small></div><div><span class="badge">FAMILY</span><b>Canine Dock Jumping Championships</b><div class="muted">Hardy Park · Aug 28–30</div></div></div></div></section><section class="sec"><div class="head"><h2>Explore Brockville</h2><a data-p="explore">More</a></div><div class="grid"><div class="card"><div class="photo">🌊</div><div class="cardbody"><span class="badge">WATERFRONT</span><h3>1000 Islands</h3><p class="muted">Boating, tours, parks and river views.</p></div></div><div class="card"><div class="photo">🚂</div><div class="cardbody"><span class="badge">HISTORY</span><h3>Railway Tunnel</h3><p class="muted">Canada's first railway tunnel.</p></div></div></div></section><section class="sec"><h2>Quick access</h2><div class="grid">${cards(['🗑️ Garbage & Recycling','🏛️ Council & Meetings','📜 Bylaws','🚌 Transit'])}</div></section>`,
report:`<div class="pagehead"><button class="back" data-p="home">←</button><h2>Report an Issue</h2></div><div class="card"><div class="photo">🚧</div><div class="cardbody"><span class="badge">CITYWIDE PORTAL</span><h3>See something that needs fixing?</h3><p class="muted">This prototype is ready to connect to Brockville's official service-request portal.</p><button class="tile primary" style="width:100%" onclick="openLink('https://citywideportal.com/')">🌐 Open Citywide Portal</button></div></div><section class="sec"><h3>Common reports</h3><div class="grid">${cards(['🕳️ Pothole','🚶 Sidewalk','💡 Streetlight','🌳 Tree concern','🎨 Graffiti','🗑️ Garbage','❄️ Snow removal','💧 Water issue','🌧️ Drainage','🌲 Park / trail','🚸 Street sign','🏚️ Property concern'])}</div></section>`,
events:`<div class="pagehead"><button class="back" data-p="home">←</button><h2>Brockville Events</h2></div><div class="card"><div class="cardbody"><span class="badge">UPCOMING</span><h3>What's happening in Brockville</h3><p class="muted">Events are gathered from established local calendars. Use the links below for the latest dates, times and ticket information.</p><button class="tile primary" style="width:100%" onclick="openLink('https://brockvilletourism.com/shows-and-events/')">📅 Brockville Tourism Calendar</button></div></div><section class="sec"><h3>Featured upcoming</h3><div class="card"><div class="event"><div class="date"><b>22</b><small>AUG</small></div><div><span class="badge">MARKET</span><b>Brockville Farmers Market</b><div class="muted">8 AM–1 PM · Market Street West</div></div></div><div class="event"><div class="date"><b>28</b><small>AUG</small></div><div><span class="badge">AUG 28–30</span><b>Canine Dock Jumping Championships</b><div class="muted">8 AM–6 PM · Hardy Park</div></div></div><div class="event"><div class="date"><b>28</b><small>AUG</small></div><div><span class="badge">THEATRE</span><b>Fame Jr. The Musical</b><div class="muted">Youth Opportunities in the Arts · Aug 28</div></div></div></div></section><section class="sec"><h3>Find more events</h3><div class="grid">${cards(['📅 Brockville Tourism Events','🏢 Chamber Events','🎭 Brockville Arts Centre'])}</div></section><section class="sec"><div class="card"><div class="cardbody"><span class="badge">FOR ORGANIZERS</span><h3>Submit a local event</h3><p class="muted">Brockville Tourism accepts event submissions for its calendar and reviews them before publication.</p><button class="tile" style="width:100%" onclick="openLink('https://brockvilletourism.com/submit-event/')">📝 Submit an Event</button></div></div></section>`,
notices:`<div class="pagehead"><button class="back" data-p="home">←</button><h2>City Notices</h2></div><div class="card"><div class="cardbody"><span class="badge">OFFICIAL CITY OF BROCKVILLE</span><h3>Municipal announcements</h3><p class="muted">Official notices from the City of Brockville, separate from local media reporting. The City says its announcements are the primary means of public communication and emergency updates.</p><button class="tile primary" style="width:100%" onclick="openLink('https://brockville.com/announcements/')">📢 View All Official City Announcements</button></div></div><section class="sec"><h3>Recent official notices</h3><div class="card"><div class="event"><div class="date"><b>29</b><small>JUL</small></div><div><span class="badge">CITY NOTICE</span><b>2026 Civic Holiday Schedule</b><div class="muted">City facilities, waste collection, transit and service changes.</div><button class="tile" style="margin-top:8px;width:100%" onclick="openLink('https://brockville.com/announcement/2026-civic-holiday-schedule/')">Read City Notice</button></div></div><div class="event"><div class="date"><b>29</b><small>JUL</small></div><div><span class="badge">CITY NOTICE</span><b>Citywide Portal Launch</b><div class="muted">New online portal for reporting non-emergency City service issues.</div><button class="tile" style="margin-top:8px;width:100%" onclick="openLink('https://brockville.com/announcement/city-launches-new-online-portal-to-improve-service-delivery/')">Read City Notice</button></div></div><div class="event"><div class="date"><b>14</b><small>JUL</small></div><div><span class="badge">PUBLIC NOTICE</span><b>Stay Cool in Brockville During a Heat Wave</b><div class="muted">City cooling locations and heat safety information.</div><button class="tile" style="margin-top:8px;width:100%" onclick="openLink('https://brockville.com/announcement/stay-cool-in-brockville-during-a-heat-wave-2/')">Read City Notice</button></div></div><div class="event"><div class="date"><b>09</b><small>JUL</small></div><div><span class="badge">CONSTRUCTION</span><b>Parkdale Avenue & Windsor Drive Intersection</b><div class="muted">Construction notice and traffic impacts.</div><button class="tile" style="margin-top:8px;width:100%" onclick="openLink('https://brockville.com/news/construction-notice-parkdale-avenue-and-windsor-drive-intersection/')">Read City Notice</button></div></div></div></section><section class="sec"><div class="grid"><button class="tile" onclick="openLink('https://brockville.com/city-services/emergency-services/')">🚨<b>Emergency Information</b><span>Official City emergency updates</span></button><button class="tile" onclick="openLink('https://brockville.com/announcements/')">🔔<b>City Announcements</b><span>Official announcement feed</span></button></div></section>`,
news:`<div class="pagehead"><button class="back" data-p="home">←</button><h2>Local News</h2></div><section class="sec"><div class="card"><div class="cardbody"><span class="badge">LOCAL MEDIA</span><h3>Brockville news sources</h3><p class="muted">Independent local reporting, newspapers, television and radio. These are separate from official City notices.</p></div></div></section><section class="sec"><div class="head"><h3>Newspapers & Digital</h3></div><div class="grid">${cards(['📰 Recorder & Times','📰 Brockvilleist','📰 Brockville Daily'])}</div></section><section class="sec"><div class="head"><h3>Local TV</h3></div><div class="grid">${cards(['📺 Hometown TV12','📺 YourTV Brockville'])}</div></section><section class="sec"><div class="head"><h3>Local Radio</h3></div><div class="grid">${cards(['📻 104.9 myFM','📻 103.7 GIANT FM'])}</div></section>`,
explore:`<div class="pagehead"><button class="back" data-p="home">←</button><h2>Explore Brockville</h2></div><div class="grid">${cards(['🌊 1000 Islands','🚂 Railway Tunnel','🏛️ Historic Downtown','🌲 Parks & Trails','🎨 Arts & Culture','🍴 Eat & Drink','🎣 Outdoor Recreation','📸 Photo Spots'])}</div>`,
map:`<div class="pagehead"><button class="back" data-p="home">←</button><h2>Brockville Map</h2></div><div class="map"><div class="river"></div><div class="pin p1">📍</div><div class="pin p2">📍</div><div class="pin p3">📍</div></div><section class="sec"><div class="grid">${cards(['🏛️ City Hall','🌲 Parks','🚗 Parking','🚻 Washrooms','🚌 Transit','🚧 Road Work'])}</div></section>`,
eat:`<div class="pagehead"><button class="back" data-p="more">←</button><h2>Eat & Drink</h2></div><div class="card"><div class="cardbody"><span class="badge">BROCKVILLE</span><h3>Local food & drink</h3><p class="muted">Browse local restaurants, cafés, pubs and fish & chips. Every listing has a Google Maps search, and selected businesses also have a direct website.</p><button class="tile primary" style="width:100%" onclick="openLink('https://brockvilletourism.com/eat-and-drink/restaurants/')">🍴 Brockville Tourism restaurant directory</button></div></div><section class="sec"><h3>Popular local spots</h3><div class="grid"><button class="tile" onclick="openLink('https://www.google.com/maps/search/?api=1&query=Don%27s+Fish+%26+Chips%2C+Brockville%2C+ON')">🍟<b>Don's Fish & Chips</b><span>40 Water St W · Maps</span></button><button class="tile" onclick="openLink('https://donsfishandchips.com/')">🌐<b>Don's website</b><span>Menu & information</span></button><button class="tile" onclick="openLink('https://www.google.com/maps/search/?api=1&query=1000+Islands+Restaurant+%26+Pizzeria%2C+Brockville%2C+ON')">🍕<b>1000 Islands Restaurant & Pizzeria</b><span>226 King St W · Maps</span></button><button class="tile" onclick="openLink('https://1000islandspizza.com/')">🌐<b>1000 Islands Pizza</b><span>Official website</span></button><button class="tile" onclick="openLink('https://www.google.com/maps/search/?api=1&query=Barley+Mow%2C+Brockville%2C+ON')">🍺<b>Barley Mow</b><span>Pub & grill · Maps</span></button><button class="tile" onclick="openLink('https://www.google.com/maps/search/?api=1&query=Buell+Street+Bistro%2C+Brockville%2C+ON')">🍽️<b>Buell Street Bistro</b><span>Fine dining · Maps</span></button><button class="tile" onclick="openLink('https://www.google.com/maps/search/?api=1&query=Nakhon+Thai%2C+Brockville%2C+ON')">🍜<b>Nakhon Thai</b><span>Thai cuisine · Maps</span></button><button class="tile" onclick="openLink('https://nakhonthai.ca/')">🌐<b>Nakhon Thai</b><span>Official website</span></button><button class="tile" onclick="openLink('https://www.google.com/maps/search/?api=1&query=The+Mill+Restaurant%2C+Brockville%2C+ON')">🍝<b>The Mill Restaurant</b><span>123 Water St W · Maps</span></button><button class="tile" onclick="openLink('https://themillrestaurant.ca/')">🌐<b>The Mill Restaurant</b><span>Official website</span></button><button class="tile" onclick="openLink('https://www.google.com/maps/search/?api=1&query=Keystorm+Pub%2C+Brockville%2C+ON')">🍻<b>Keystorm Pub</b><span>2 Court House Ave · Maps</span></button><button class="tile" onclick="openLink('https://keystormpub.ca/')">🌐<b>Keystorm Pub</b><span>Official website</span></button><button class="tile" onclick="openLink('https://www.google.com/maps/search/?api=1&query=Richard%27s+Coffeehouse%2C+Brockville%2C+ON')">☕<b>Richard's Coffeehouse</b><span>Café · Maps</span></button><button class="tile" onclick="openLink('https://www.google.com/maps/search/?api=1&query=Manoll%27s+Fish+%26+Chips%2C+Brockville%2C+ON')">🍟<b>Manoll's Fish & Chips</b><span>11 Buell St · Maps</span></button><button class="tile" onclick="openLink('https://www.google.com/maps/search/?api=1&query=Sam%27s+Grill%2C+Brockville%2C+ON')">🍔<b>Sam's Grill</b><span>Burgers & poutine · Maps</span></button><button class="tile" onclick="openLink('https://www.google.com/maps/search/?api=1&query=One+Love+Jamaican+Cuisine%2C+Brockville%2C+ON')">🌴<b>One Love Jamaican Cuisine</b><span>Jamaican · Maps</span></button></div></section><section class="sec"><div class="card"><div class="cardbody"><span class="badge">MORE</span><h3>Find every local option</h3><p class="muted">Brockville Tourism maintains the broader local dining directory, including cafés, pubs, international food and seasonal spots.</p><button class="tile" style="width:100%" onclick="openLink('https://brockvilletourism.com/eat-and-drink/restaurants/')">📋 Full restaurant directory</button></div></div></section>`,
more:`<div class="pagehead"><button class="back" data-p="home">←</button><h2>More Brockville</h2></div><div class="grid">${cards(['🍴 Eat & Drink','📢 City Notices','📰 Local News','📜 Bylaws','🏛️ Council & Government','📹 River Webcams','💧 Water & Sewer','🚌 Transit','🏗️ Building & Development','💼 City Careers','📞 City Contacts','📝 Forms','🚨 Emergency Information','📣 Community Feedback','⭐ Favorites'])}</div>`
};
function show(p,fromHistory=false){m.innerHTML=P[p]||P.home;document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.p===p));document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>show(b.dataset.p));scrollTo(0,0);if(!fromHistory){history.pushState({page:p},'', '#'+p)}}
window.addEventListener('popstate',()=>show(location.hash.slice(1)||'home',true));
show(location.hash.slice(1)||'home',true);document.getElementById('q').onkeydown=e=>{if(e.key==='Enter'&&e.target.value.trim())show('more')};
</script></body></html>
