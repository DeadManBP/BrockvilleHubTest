<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brockville Hub</title><style>
*{box-sizing:border-box}body{margin:0;background:#071b2a;color:#f7fbfc;font:15px system-ui;line-height:1.4}.app{max-width:720px;margin:auto;padding-bottom:75px}
.hero{padding:22px 17px 20px;background:radial-gradient(circle at 90% 5%,#2d8296,transparent 35%),linear-gradient(145deg,#0d4054,#071b2a)}
.logo{display:inline-grid;place-items:center;width:45px;height:45px;border-radius:15px;background:#43b7c7;font-size:24px;font-weight:900;margin-right:10px;vertical-align:middle}.brand{font-weight:800;font-size:20px}.sub{color:#9bc4cd;font-size:11px;letter-spacing:.12em}.hero h1{font-size:30px;line-height:1.05;margin:28px 0 5px}.muted{color:#a9c1ca;font-size:13px}.search{width:100%;padding:13px;border-radius:15px;border:1px solid #315263;background:#071b2a;color:white;margin-top:15px}
main{padding:0 15px}.sec{margin-top:18px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile,.card{background:linear-gradient(145deg,#12384d,#0d293a);border:1px solid #234556;border-radius:18px}.tile{padding:15px;text-align:left;color:white;cursor:pointer}.tile b{display:block;margin-top:7px}.tile span{display:block;color:#a9c1ca;font-size:12px;margin-top:3px}.primary{background:linear-gradient(135deg,#43b7c7,#287b91);border:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:12px;background:#0d293a;border:1px solid #234556;border-radius:15px}.stat b{display:block;font-size:21px}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#123f4c;color:#79d9e2;font-size:10px;font-weight:800}.cardbody{padding:15px}.event{display:flex;gap:12px;padding:12px 15px;border-bottom:1px solid #234556}.date{width:48px;min-width:48px;text-align:center;background:#0a2231;border-radius:12px;padding:5px}.date b{font-size:18px;display:block}.photo{height:105px;background:linear-gradient(135deg,#18506a,#0a2534);display:grid;place-items:center;font-size:42px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#06141f;border-top:1px solid #234556;padding:8px}.bottom button{border:0;background:none;color:#78929c;font-size:10px}.bottom .active{color:#7ce0e9}.bottom i{display:block;font-size:20px;font-style:normal}.back{padding:9px 12px;border-radius:12px;background:#102f42;color:white;border:1px solid #234556}.pagehead{display:flex;gap:10px;align-items:center;margin:18px 0}.map{height:230px;border-radius:20px;background:#12384d;position:relative;overflow:hidden;border:1px solid #234556}.river{position:absolute;right:-15%;top:-20%;width:65%;height:150%;background:#2d829633;border-radius:50%;transform:rotate(-18deg)}.pin{position:absolute;font-size:25px}.p1{left:25%;top:35%}.p2{left:55%;top:63%}.p3{left:70%;top:28%}
</style></head><body><div class="app"><header class="hero"><div><span class="logo">B</span><span class="brand">Brockville Hub</span><div class="sub">BROCKVILLE • ONTARIO • 1000 ISLANDS</div></div><h1>Your city.<br>One place.</h1><div class="muted">News, services, events and things to do.</div><input id="q" class="search" placeholder="🔎 Search Brockville Hub"></header><main id="m"></main>
<nav class="bottom"><button data-p="home">⌂<br>Home</button><button data-p="events">◷<br>Events</button><button data-p="report">⚠<br>Report</button><button data-p="map">⌖<br>Map</button><button data-p="more">☰<br>More</button></nav></div>
<script>
const m=document.getElementById('m');
const cards=(a)=>a.map(x=>`<button class="tile">${x}</button>`).join('');
const P={
home:`<section class="sec"><div class="grid"><button class="tile primary" data-p="report">🚧<b>Report an Issue</b><span>Citywide Portal</span></button><button class="tile" data-p="events">📅<b>What's Happening</b><span>Events & activities</span></button><button class="tile" data-p="news">📢<b>City Notices</b><span>News & announcements</span></button><button class="tile" data-p="explore">❤️<b>Things To Do</b><span>Explore Brockville</span></button></div></section>
<section class="sec"><div class="head"><h2>City at a glance</h2><span class="badge">PROTOTYPE</span></div><div class="stats"><div class="stat">🚧<b>6+</b><small>projects</small></div><div class="stat">📢<b>5</b><small>notices</small></div><div class="stat">🗳️<b>2026</b><small>election</small></div></div></section>
<section class="sec"><div class="head"><h2>Latest from City Hall</h2><a data-p="news">See all</a></div><div class="card"><div class="cardbody"><span class="badge">JUL 29</span><h3>New Citywide Portal launches</h3><p class="muted">Report potholes, sidewalks, parks, graffiti, trees, streetlights and other City-maintained infrastructure online.</p><button class="tile primary" data-p="report" style="width:100%">🚧 Reporting options</button></div></div></section>
<section class="sec"><div class="head"><h2>Coming up</h2><a data-p="events">Calendar</a></div><div class="card"><div class="event"><div class="date"><b>22</b><small>AUG</small></div><div><span class="badge">CITY EVENT</span><b>Household Hazardous Waste Day</b><div class="muted">8 AM–2 PM · Memorial Civic Centre</div></div></div><div class="event"><div class="date"><b>SUM</b><small>2026</small></div><div><span class="badge">SUMMER</span><b>Waterfront activities</b><div class="muted">Festivals, concerts and recreation.</div></div></div></div></section>
<section class="sec"><div class="head"><h2>Explore Brockville</h2><a data-p="explore">More</a></div><div class="grid"><div class="card"><div class="photo">🌊</div><div class="cardbody"><span class="badge">WATERFRONT</span><h3>1000 Islands</h3><p class="muted">Boating, tours, parks and river views.</p></div></div><div class="card"><div class="photo">🚂</div><div class="cardbody"><span class="badge">HISTORY</span><h3>Railway Tunnel</h3><p class="muted">Canada's first railway tunnel.</p></div></div></div></section>
<section class="sec"><h2>Quick access</h2><div class="grid">${cards(['🗑️ Garbage & Recycling','🏛️ Council & Meetings','📜 Bylaws','🚌 Transit'])}</div></section>`,
report:`<div class="pagehead"><button class="back" data-p="home">←</button><h2>Report an Issue</h2></div><div class="card"><div class="photo">🚧</div><div class="cardbody"><span class="badge">CITYWIDE PORTAL</span><h3>See something that needs fixing?</h3><p class="muted">This prototype is ready to connect to Brockville's official service-request portal.</p><button class="tile primary" style="width:100%" onclick="alert('Prototype: this will open the official Citywide Portal.')">🌐 Open Citywide Portal</button></div></div><section class="sec"><h3>Common reports</h3><div class="grid">${cards(['🕳️ Pothole','🚶 Sidewalk','💡 Streetlight','🌳 Tree concern','🎨 Graffiti','🗑️ Garbage','❄️ Snow removal','💧 Water issue','🌧️ Drainage','🌲 Park / trail','🚸 Street sign','🏚️ Property concern'])}</div></section>`,
events:`<div class="pagehead"><button class="back" data-p="home">←</button><h2>What's Happening</h2></div><div class="grid">${cards(['📅 Today','📆 This Week','☀️ Summer','🎭 Arts & Culture'])}</div><section class="sec"><div class="card"><div class="cardbody"><span class="badge">AUG 22</span><h3>Household Hazardous Waste Day</h3><p class="muted">8 AM–2 PM · Memorial Civic Centre</p></div></div></section>`,
news:`<div class="pagehead"><button class="back" data-p="home">←</button><h2>City Hall Notices</h2></div><div class="grid">${cards(['📢 New Citywide Portal','🚧 Centennial Road update','☀️ Heat wave information','🚦 Parkdale & Windsor construction'])}</div>`,
explore:`<div class="pagehead"><button class="back" data-p="home">←</button><h2>Explore Brockville</h2></div><div class="grid">${cards(['🌊 1000 Islands','🚂 Railway Tunnel','🏛️ Historic Downtown','🌲 Parks & Trails','🎨 Arts & Culture','🍔 Food & Drink','🎣 Outdoor Recreation','📸 Photo Spots'])}</div>`,
map:`<div class="pagehead"><button class="back" data-p="home">←</button><h2>Brockville Map</h2></div><div class="map"><div class="river"></div><div class="pin p1">📍</div><div class="pin p2">📍</div><div class="pin p3">📍</div></div><section class="sec"><div class="grid">${cards(['🏛️ City Hall','🌲 Parks','🚗 Parking','🚻 Washrooms','🚌 Transit','🚧 Road Work'])}</div></section>`,
more:`<div class="pagehead"><button class="back" data-p="home">←</button><h2>More Brockville</h2></div><div class="grid">${cards(['📜 Bylaws','🏛️ Council & Government','📹 River Webcams','💧 Water & Sewer','🚌 Transit','🏗️ Building & Development','💼 City Careers','📞 City Contacts','📝 Forms','🚨 Emergency Information','📣 Community Feedback','⭐ Favorites'])}</div>`
};
function show(p){m.innerHTML=P[p]||P.home;document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.p===p));document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>show(b.dataset.p));scrollTo(0,0)}
show('home');document.getElementById('q').onkeydown=e=>{if(e.key==='Enter'&&e.target.value.trim())show('more')};
</script></body></html>
